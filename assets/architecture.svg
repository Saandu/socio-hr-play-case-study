<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc"><title id="title">Socio HR Play high-level architecture</title><desc id="desc">The React interface connects to Firebase Authentication, rule-controlled Firestore and Storage, and Cloud Functions. Functions supply homepage settings and call EmailJS using server-side secrets.</desc><rect width="1100" height="490" rx="18" fill="#f8fafc"/><text x="36" y="47" font-family="Arial, sans-serif" font-size="29" fill="#0f172a" font-weight="700">Application architecture</text><rect x="36" y="160" width="300" height="170" rx="14" fill="#dbeafe" stroke="#dbe3ed"/><text x="60" y="201" font-family="Arial, sans-serif" font-size="25" fill="#172554" font-weight="700">React + TypeScript</text><text x="60" y="239" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" font-weight="400">Public · student · staff UI</text><text x="60" y="275" font-family="Arial, sans-serif" font-size="18" fill="#1e293b" font-weight="400">Router · Context · local state</text><path d="M336 245 H390 V137 H430" fill="none" stroke="#64748b" stroke-width="2"/><rect x="430" y="90" width="338" height="94" rx="14" fill="#ffffff" stroke="#dbe3ed"/><text x="451" y="126" font-family="Arial, sans-serif" font-size="23" fill="#172554" font-weight="700">Authentication</text><text x="451" y="156" font-family="Arial, sans-serif" font-size="17" fill="#1e293b" font-weight="400">Sign-in and session identity</text><path d="M336 245 H390 V262 H430" fill="none" stroke="#64748b" stroke-width="2"/><rect x="430" y="215" width="338" height="94" rx="14" fill="#ffffff" stroke="#dbe3ed"/><text x="451" y="251" font-family="Arial, sans-serif" font-size="23" fill="#172554" font-weight="700">Firestore + Storage</text><text x="451" y="281" font-family="Arial, sans-serif" font-size="17" fill="#1e293b" font-weight="400">Data and images · access rules</text><path d="M336 245 H390 V387 H430" fill="none" stroke="#64748b" stroke-width="2"/><rect x="430" y="340" width="338" height="94" rx="14" fill="#ffffff" stroke="#dbe3ed"/><text x="451" y="376" font-family="Arial, sans-serif" font-size="23" fill="#172554" font-weight="700">Cloud Functions</text><text x="451" y="406" font-family="Arial, sans-serif" font-size="17" fill="#1e293b" font-weight="400">Homepage text · email delivery</text><path d="M768 387 H804" stroke="#64748b" stroke-width="2"/><rect x="804" y="340" width="260" height="94" rx="14" fill="#ecfdf5" stroke="#dbe3ed"/><text x="826" y="376" font-family="Arial, sans-serif" font-size="23" fill="#065f46" font-weight="700">EmailJS</text><text x="826" y="408" font-family="Arial, sans-serif" font-size="17" fill="#1e293b" font-weight="400">Server-held configuration</text><text x="36" y="462" font-family="Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Conceptual overview. No deployment identifiers, secrets, or participant data.</text></svg>